# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: GaNDLF TaskRunner E2E

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  # A workaround for long FQDN names provided by GitHub actions.
  FQDN: "localhost"

jobs:
  gandlf_seg_test:
    name: GaNDLF Segmentation Test (torch/mnist, 3.10)
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      MODEL_NAME: "gandlf_seg_test"
      NUM_ROUNDS: 3
      NUM_COLLABORATORS: 2

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install typer==0.11.1
        pip install torch==2.3.1+cpu torchvision torchaudio --extra-index-url https://download.pytorch.org/whl/cpu
        pip install .
        pip install paramiko

    - name: Install GaNDLF
      run: |
        git clone https://github.com/MLCommons/GaNDLF.git ./gandlf
        cd gandlf
        git fetch --tags
        echo "Checkout the latest GaNDLF tag"
        latestTag=$(git describe --tags "$(git rev-list --tags --max-count=1)")
        # Instead of using the latest tag, we are pinning gandlf to an older version as changes are required
        # in torch to work with a later version.
        git checkout 0.1.1

    - name: GaNDLF Test Pre-Requisites
      run: |
        cd gandlf
        pwd
        pip install -e .
        pip uninstall onnx -y
        cat ./GANDLF/version.py
        echo "Download data and Split CSVs into training and validation"
        pytest --cov=. --cov-report=xml -k "prepare_data_for_ci"
        head -n 1 testing/data/train_2d_rad_segmentation.csv > /home/runner/work/openfl/openfl/valid.csv
        tail -n +9 testing/data/train_2d_rad_segmentation.csv >> /home/runner/work/openfl/openfl/valid.csv
        head -n 8 testing/data/train_2d_rad_segmentation.csv > /home/runner/work/openfl/openfl/train.csv
        cp testing/config_segmentation.yaml /home/runner/work/openfl/openfl/config_segmentation.yaml
        echo "DEBUG display the config file"
        cat /home/runner/work/openfl/openfl/config_segmentation.yaml
        sed -i 's/# n_channels: 3/num_channels: 3/g' "/home/runner/work/openfl/openfl/config_segmentation.yaml"
        echo "After adding num_channels: 3"
        cat /home/runner/work/openfl/openfl/config_segmentation.yaml

    - name: Run Task Runner E2E tests for GanDLF
      id: run_tests
      run: |
        python -m pytest -s tests/end_to_end/test_suites/task_runner_tests.py \
        -m task_runner_basic_gandlf --model_name ${{ env.MODEL_NAME }} \
        --num_rounds ${{ env.NUM_ROUNDS }} --num_collaborators ${{ env.NUM_COLLABORATORS }}
        echo "Task runner end to end test run completed"

    - name: Create Tar (exclude folders - cert/data/__pycache__, files - tensor.db/workspace.tar)
      id: tar_files
      if: ${{ always() }}
      run: |
        tar -cvf result.tar --exclude="cert" --exclude="data" --exclude="__pycache__" --exclude="tensor.db" --exclude="workspace.tar" $HOME/results /home/runner/work/openfl/openfl/config_segmentation.yaml /home/runner/work/openfl/openfl/valid.csv /home/runner/work/openfl/openfl/train.csv

    - name: Upload Artifacts
      id: upload_artifacts
      uses: actions/upload-artifact@v4
      if: ${{ always() }}
      with:
        name: gandlf_artifacts
        path: result.tar

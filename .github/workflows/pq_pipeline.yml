#---------------------------------------------------------------------------
# Nightly pipeline for OpenFL Product Quality
# This pipeline is scheduled to run every day at 2:30 PM UTC time.
#---------------------------------------------------------------------------
name: OpenFL Product Quality Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: '30 14 * * *'

permissions:
  contents: read
  actions: write
  pull-requests: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.base_ref }}-${{ github.head_ref }}-${{ github.actor }}

jobs:
  set_commit_id:
    name: Get/Set Commit ID
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-22.04
    outputs:
      commit_id: ${{ steps.set_commit_id.outputs.commit_id }}
    steps:
    - name: Checkout OpenFL repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 2 # needed for detecting changes
        submodules: "true"
        token: ${{ secrets.GITHUB_TOKEN }}
    - name: Set commit ID
      id: set_commit_id
      run: echo "::set-output name=commit_id::$(git rev-parse HEAD)"
    - name: Use commit ID
      run: echo "The commit ID is ${{ steps.set_commit_id.outputs.commit_id }}"
    - name: Print Commit Id in GitHub summary
      run: echo "Commit ID is ${{ steps.set_commit_id.outputs.commit_id }}" >> $GITHUB_STEP_SUMMARY

  wf_mnist_local_runtime:
    if: |
      (github.event_name == 'schedule' && github.repository_owner == 'securefederatedai') ||
      (github.event_name == 'workflow_dispatch')
    name: Workflow MNIST Local Runtime
    needs: set_commit_id
    uses: ./.github/workflows/workflow_interface_101_mnist.yml
    with:
      commit_id: ${{ needs.set_commit_id.outputs.commit_id }}


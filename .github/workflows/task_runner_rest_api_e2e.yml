---
# Task Runner E2E with Rest transport protocol.

name: TASK_RUNNER_REST_API_E2E  # Please do not modify the name as it is used in the composite action

on:
  workflow_call:
    inputs:
      commit_id:
        required: false
        type: string
  workflow_dispatch:
    inputs:
      num_rounds:
        description: "Number of rounds to train"
        required: false
        default: "5"
        type: string
      num_collaborators:
        description: "Number of collaborators"
        required: false
        default: "2"
        type: string

permissions:
  contents: read

# Environment variables common for all the jobs
# DO NOT use double quotes for the values of the environment variables

env:
  NUM_ROUNDS: ${{ inputs.num_rounds || 5 }}
  NUM_COLLABORATORS: ${{ inputs.num_collaborators || 2 }}
  MODEL_NAME: ${{ inputs.model_name }}
  PYTHON_VERSION: ${{ inputs.python_version }}
  COMMIT_ID: ${{ inputs.commit_id || github.sha }} # use commit_id from the calling workflow

jobs:
  with_tls_rest_api_no_op:
    name: With TLS (no-op, 3.12)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false # do not immediately fail if one of the combinations fail

    env:
      MODEL_NAME: 'no-op'
      PYTHON_VERSION: '3.12'

    steps:
      - name: Checkout OpenFL repository
        id: checkout_openfl
        uses: actions/checkout@v4
        with:
          ref: ${{ env.COMMIT_ID }}

      - name: Pre test run
        uses: ./.github/actions/tr_pre_test_run
        if: ${{ always() }}

      - name: Run Task Runner E2E tests with TLS and no op
        id: run_tests
        run: |
          python -m pytest -s tests/end_to_end/test_suites/task_runner_tests.py \
          -m task_runner_basic_ping_pong --model_name ${{ env.MODEL_NAME }} \
          --num_collaborators ${{ env.NUM_COLLABORATORS }}  --tr_rest_api 
          echo "Task runner end to end test run completed"

      - name: Post test run
        uses: ./.github/actions/tr_post_test_run
        if: ${{ always() }}
        with:
          test_type: "With_TLS_No_Op_Rest_API"

  without_tls_rest_api:
    name: Without TLS (keras/mnist, 3.11)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false # do not immediately fail if one of the combinations fail

    env:
      MODEL_NAME: "keras/mnist"
      PYTHON_VERSION: '3.11'

    steps:
      - name: Checkout OpenFL repository
        id: checkout_openfl
        uses: actions/checkout@v4
        with:
          ref: ${{ env.COMMIT_ID }}

      - name: Pre test run
        uses: ./.github/actions/tr_pre_test_run
        if: ${{ always() }}

      - name: Run Task Runner E2E tests without TLS
        id: run_tests
        run: |
          python -m pytest -s tests/end_to_end/test_suites/task_runner_tests.py \
          -m task_runner_basic --model_name ${{ env.MODEL_NAME }} \
          --num_collaborators ${{ env.NUM_COLLABORATORS }} --num_rounds ${{ env.NUM_ROUNDS }} --tr_rest_api --disable_tls
          echo "Task runner end to end test run completed"

      - name: Post test run
        uses: ./.github/actions/tr_post_test_run
        if: ${{ always() }}
        with:
          test_type: "Without_TLS_Rest_API"
          
  without_client_auth_rest_api:
    name: Rest API Without Client Auth(keras/jax/mnist, 3.10)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false # do not immediately fail if one of the combinations fail

    env:
      MODEL_NAME: 'keras/jax/mnist' 
      PYTHON_VERSION: '3.10'

    steps:
      - name: Checkout OpenFL repository
        id: checkout_openfl
        uses: actions/checkout@v4
        with:
          ref: ${{ env.COMMIT_ID }}

      - name: Pre test run
        uses: ./.github/actions/tr_pre_test_run
        if: ${{ always() }}

      - name: Run Task Runner E2E tests without TLS and without client auth
        id: run_tests
        run: |
          python -m pytest -s tests/end_to_end/test_suites/task_runner_tests.py \
          -m task_runner_basic --model_name ${{ env.MODEL_NAME }} \
          --num_collaborators ${{ env.NUM_COLLABORATORS }} --num_rounds ${{ env.NUM_ROUNDS }} --tr_rest_api --disable_client_auth
          echo "Task runner end to end test run completed"

      - name: Post test run
        uses: ./.github/actions/tr_post_test_run
        if: ${{ always() }}
        with:
          test_type: "Without_TLS_Without_Client_Auth_Rest_API"

  straggler_cutoff_rest_api:
    name: Rest API Cutoff Policy (torch/mnist_straggler_check, 3.12)
    if: |
      (github.event_name == 'schedule' && github.repository_owner == 'securefederatedai') ||
      (github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      MODEL_NAME: 'torch/mnist_straggler_check'
      PYTHON_VERSION: '3.10'
    steps:
      - name: Checkout OpenFL repository
        id: checkout_openfl
        uses: actions/checkout@v4
        with:
          ref: ${{ env.COMMIT_ID }}

      - name: Pre test run
        uses: ./.github/actions/tr_pre_test_run
        if: ${{ always() }}

      - name: Run Task Runner cutofftime straggler tests
        id: run_tests
        run: |
          python -m pytest -s tests/end_to_end/test_suites/tr_resiliency_tests.py -k test_straggler_cutoff --tr_rest_api
          echo "Task runner end to end test run completed"

      - name: Post test run
        uses: ./.github/actions/tr_post_test_run
        if: ${{ always() }}
        with:
          test_type: "With_TLS_Cutoff_Rest_API"

  resiliency_rest_api:
    name: Rest API Resiliency (keras/mnist, 3.10)
    if: |
      (github.event_name == 'schedule' && github.repository_owner == 'securefederatedai') ||
      (github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      MODEL_NAME: 'keras/mnist'
      PYTHON_VERSION: '3.10'
    steps:
      - name: Checkout OpenFL repository
        id: checkout_openfl
        uses: actions/checkout@v4
        with:
          ref: ${{ env.COMMIT_ID }}

      - name: Pre test run
        uses: ./.github/actions/tr_pre_test_run
        if: ${{ always() }}

      - name: Run Task Runner resiliency tests
        id: run_tests
        run: |
          python -m pytest -s tests/end_to_end/test_suites/tr_resiliency_tests.py -k test_federation_via_native_with_restarts --model_name ${{ env.MODEL_NAME }} --num_rounds 25 --tr_rest_api
          echo "Task runner end to end test run completed"

      - name: Post test run
        uses: ./.github/actions/tr_post_test_run
        if: ${{ always() }}
        with:
          test_type: "With_TLS_Resiliency_Rest_API"

  fedeval_rest_api:
    name: FedEval Rest API (torch/mnist, 3.10)
    if: |
      (github.event_name == 'schedule' && github.repository_owner == 'securefederatedai') ||
      (github.event_name == 'workflow_dispatch') ||
      (github.event.pull_request.draft == false)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false # do not immediately fail if one of the combinations fail

    env:
      MODEL_NAME: 'torch/mnist'
      PYTHON_VERSION: '3.10'

    steps:
      - name: Checkout OpenFL repository
        id: checkout_openfl
        uses: actions/checkout@v4
        with:
          ref: ${{ env.COMMIT_ID }}

      - name: Pre test run
        uses: ./.github/actions/tr_pre_test_run
        if: ${{ always() }}

      - name: Run Task Runner E2E tests with TLS
        id: run_tests
        run: |
          python -m pytest -s tests/end_to_end/test_suites/tr_with_fedeval_tests.py \
          -m task_runner_basic --model_name ${{ env.MODEL_NAME }} \
          --num_rounds ${{ env.NUM_ROUNDS }} --num_collaborators ${{ env.NUM_COLLABORATORS }}
          echo "Task runner end to end test run completed"

      - name: Post test run
        uses: ./.github/actions/tr_post_test_run
        if: ${{ always() }}
        with:
          test_type: "FedEval_With_TLS_REST_API"
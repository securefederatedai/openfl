name: Trivy Nightly Scan

on:
  workflow_call:
    inputs:
      commit_id:
        required: false
        type: string
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *' # Every night at midnight UTC

jobs:
  build:
    if: github.event.pull_request.draft == false
    permissions:
      contents: read
      security-events: write
      actions: read
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    env:
      TRIVY_DB_REPOSITORY: 'ghcr.io/aquasecurity/trivy-db,public.ecr.aws/aquasecurity/trivy-db'
      COMMIT_ID: ${{ inputs.commit_id || github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.COMMIT_ID }}

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin

      - name: Run Trivy code vulnerability scanner (JSON Output)
        run: |
          trivy --quiet fs \
          --format json \
          --output trivy-code-results.json \
          --ignore-unfixed \
          --vuln-type os,library \
          --severity CRITICAL,HIGH,MEDIUM \
          .

      - name: Display Trivy code Scan Results
        if: failure()
        run: |
          echo "Trivy Scan Results:"
          cat trivy-code-results.json | jq '.Results[] | select(.Vulnerabilities != null) | .Vulnerabilities[] | {VulnerabilityID, PkgName, InstalledVersion, Severity, Description}'

      - name: Upload Code Vulnerability Scan Results
        uses: actions/upload-artifact@v4
        with:
          name: trivy-code-report-json
          path: trivy-code-results.json

      - name: Build an image from Dockerfile
        run: |
          docker build --pull -t docker.io/securefederatedai/openfl:${{ github.sha }} -f openfl-docker/Dockerfile.base .

      - name: Run Trivy vulnerability scanner for Docker image (JSON Output)
        id: trivy-scan
        uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: 'docker.io/securefederatedai/openfl:${{ github.sha }}'
          format: 'json'
          output: 'trivy-docker-results.json'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH,MEDIUM'
          trivyignores: '.trivyignore'

      - name: Display Trivy Docker Scan Results
        if: failure()
        run: |
          if [ -s trivy-docker-results.json ]; then
            echo "Trivy Scan Results:"
            cat trivy-docker-results.json | jq '.Results[] | select(.Vulnerabilities != null) | .Vulnerabilities[] | {VulnerabilityID, PkgName, InstalledVersion, Severity, Description}'
          else
            echo "Trivy scan results file is empty or not found."
          fi

      - name: Upload final Trivy Docker Vulnerability Scan
        uses: actions/upload-artifact@v4
        with:
          name: trivy-docker-report-json
          path: trivy-docker-results.json

      - name: Run Trivy code vulnerability scanner (SPDX-JSON Output)
        run: |
          trivy --quiet fs \
          --format spdx-json \
          --output trivy-code-spdx-results.json \
          --ignore-unfixed \
          --vuln-type os,library \
          --severity CRITICAL,HIGH,MEDIUM \
          .

      - name: Upload SPDX Code Vulnerability Scan Results
        uses: actions/upload-artifact@v4
        with:
          name: trivy-code-spdx-report-json
          path: trivy-code-spdx-results.json

      - name: Run Trivy vulnerability scanner for Docker image (SPDX-JSON Output)
        uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: 'docker.io/securefederatedai/openfl:${{ github.sha }}'
          format: 'spdx-json'
          output: 'trivy-docker-spdx-results.json'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH,MEDIUM'
          trivyignores: '.trivyignore'

      - name: Upload SPDX Docker Vulnerability Scan
        uses: actions/upload-artifact@v4
        with:
          name: trivy-docker-spdx-report-json
          path: trivy-docker-spdx-results.json

      - name: Generate Vulnerability Summary
        id: summary
        if: always()
        run: |
          echo "## Trivy Security Scan Summary" > vulnerability-summary.md
          echo "Scan Date: $(date)" >> vulnerability-summary.md
          echo "Repository: ${{ github.repository }}" >> vulnerability-summary.md
          echo "Commit: ${{ env.COMMIT_ID }}" >> vulnerability-summary.md
          echo "" >> vulnerability-summary.md
          
          if [ -s trivy-code-results.json ]; then
            VULN_COUNT=$(jq '[.Results[] | select(.Vulnerabilities != null) | .Vulnerabilities[]] | length' trivy-code-results.json)
            if [ "$VULN_COUNT" -gt 0 ]; then
              echo "### Code Vulnerabilities Detected: $VULN_COUNT" >> vulnerability-summary.md
              echo "" >> vulnerability-summary.md
              echo "| Severity | Vulnerability ID | Package | Version | Description |" >> vulnerability-summary.md
              echo "|----------|------------------|---------|---------|-------------|" >> vulnerability-summary.md
              jq -r '.Results[] | select(.Vulnerabilities != null) | .Vulnerabilities[] | "| \(.Severity) | \(.VulnerabilityID) | \(.PkgName) | \(.InstalledVersion) | \(.Title) |"' trivy-code-results.json >> vulnerability-summary.md
              echo "has_vulnerabilities=true" >> $GITHUB_OUTPUT
            fi
          fi

          if [ -s trivy-docker-results.json ]; then
            VULN_COUNT=$(jq '[.Results[] | select(.Vulnerabilities != null) | .Vulnerabilities[]] | length' trivy-docker-results.json)
            if [ "$VULN_COUNT" -gt 0 ]; then
              echo "### Docker Image Vulnerabilities Detected: $VULN_COUNT" >> vulnerability-summary.md
              echo "" >> vulnerability-summary.md
              echo "| Severity | Vulnerability ID | Package | Version | Description |" >> vulnerability-summary.md
              echo "|----------|------------------|---------|---------|-------------|" >> vulnerability-summary.md
              jq -r '.Results[] | select(.Vulnerabilities != null) | .Vulnerabilities[] | "| \(.Severity) | \(.VulnerabilityID) | \(.PkgName) | \(.InstalledVersion) | \(.Title) |"' trivy-docker-results.json >> vulnerability-summary.md
              echo "has_vulnerabilities=true" >> $GITHUB_OUTPUT
            fi
          fi

          cat vulnerability-summary.md

      - name: Upload Vulnerability Summary
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vulnerability-summary
          path: vulnerability-summary.md

      - name: Extract Code Owners
        id: codeowners
        if: always()
        run: |
          if [ -f "CODEOWNERS" ]; then
            OWNERS=$(grep -v "^#" CODEOWNERS | grep -o '@[^ ]*' | sort -u | tr '\n' ',' | sed 's/,$//')
            echo "owners=$OWNERS" >> $GITHUB_OUTPUT
            echo "Found code owners: $OWNERS"
          else
            echo "No CODEOWNERS file found, using default recipients"
            echo "owners=" >> $GITHUB_OUTPUT
          fi

      - name: Read vulnerability summary into output
        id: read_summary
        if: always()
        run: |
          {
            echo "summary<<EOF"
            cat vulnerability-summary.md
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Send Email Notification
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: >
            ${{ steps.summary.outputs.has_vulnerabilities == 'true' && '⚠️ Vulnerabilities Found:' || '✅ Scan Completed:' }} Security Scan for ${{ github.repository }}
          html_body: |
            <p>View <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">workflow run</a> | <a href="${{ github.server_url }}/${{ github.repository }}/commit/${{ env.COMMIT_ID }}">commit</a></p>
            ${{ steps.read_summary.outputs.summary }}
            <p>Download full reports from workflow artifacts.</p>
          to: ${{ steps.codeowners.outputs.owners || secrets.SECURITY_EMAIL_RECIPIENTS }}
          from: GitHub Actions <noreply@github.com>


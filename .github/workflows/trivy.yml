name: Trivy Nightly Scan

on:
  workflow_call:
    inputs:
      commit_id:
        required: false
        type: string
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *' # Every night at midnight UTC

jobs:
  build:
    if: github.event.pull_request.draft == false
    permissions:
      contents: read
      security-events: write
      actions: read
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    env:
      TRIVY_DB_REPOSITORY: 'ghcr.io/aquasecurity/trivy-db,public.ecr.aws/aquasecurity/trivy-db'
      COMMIT_ID: ${{ inputs.commit_id || github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.COMMIT_ID }}

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin

      - name: Run Trivy code vulnerability scanner (JSON)
        continue-on-error: true
        run: |
          trivy fs \
            --quiet \
            --format json \
            --output trivy-code-results.json \
            --ignore-unfixed \
            --vuln-type os,library \
            --severity CRITICAL,HIGH,MEDIUM .

      - name: Upload Trivy Code JSON
        uses: actions/upload-artifact@v4
        with:
          name: trivy-code-report-${{ env.COMMIT_ID }}
          path: trivy-code-results.json

      - name: Build Docker Image
        run: |
          docker build --pull -t docker.io/securefederatedai/openfl:${{ github.sha }} -f openfl-docker/Dockerfile.base .

      - name: Trivy scan for Docker image (JSON)
        id: trivy-image-json
        uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: 'docker.io/securefederatedai/openfl:${{ github.sha }}'
          format: 'json'
          output: 'trivy-docker-results.json'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH,MEDIUM'
          trivyignores: '.trivyignore'
        continue-on-error: true

      - name: Upload Trivy Docker JSON
        uses: actions/upload-artifact@v4
        with:
          name: trivy-docker-report-${{ env.COMMIT_ID }}
          path: trivy-docker-results.json

      - name: Trivy scan for code (SPDX)
        continue-on-error: true
        run: |
          trivy fs \
            --quiet \
            --format spdx-json \
            --output trivy-code-spdx-results.json \
            --ignore-unfixed \
            --vuln-type os,library \
            --severity CRITICAL,HIGH,MEDIUM .

      - name: Upload Trivy SPDX Code
        uses: actions/upload-artifact@v4
        with:
          name: trivy-code-spdx-${{ env.COMMIT_ID }}
          path: trivy-code-spdx-results.json

      - name: Trivy scan for Docker image (SPDX)
        uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: 'docker.io/securefederatedai/openfl:${{ github.sha }}'
          format: 'spdx-json'
          output: 'trivy-docker-spdx-results.json'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH,MEDIUM'
          trivyignores: '.trivyignore'
        continue-on-error: true

      - name: Upload Trivy SPDX Docker
        uses: actions/upload-artifact@v4
        with:
          name: trivy-docker-spdx-${{ env.COMMIT_ID }}
          path: trivy-docker-spdx-results.json

      - name: Generate Vulnerability Summary
        id: summary
        if: always()
        run: |
          echo "## Trivy Security Scan Summary" > vulnerability-summary.md
          echo "Scan Date: $(date)" >> vulnerability-summary.md
          echo "Repository: ${{ github.repository }}" >> vulnerability-summary.md
          echo "Commit: ${{ env.COMMIT_ID }}" >> vulnerability-summary.md
          echo "" >> vulnerability-summary.md

          HAS_VULNS=false

          if [ -s trivy-code-results.json ]; then
            COUNT=$(jq '[.Results[] | select(.Vulnerabilities != null) | .Vulnerabilities[]] | length' trivy-code-results.json)
            if [ "$COUNT" -gt 0 ]; then
              HAS_VULNS=true
              echo "### Code Vulnerabilities Detected: $COUNT" >> vulnerability-summary.md
              echo "| Severity | ID | Package | Version | Description |" >> vulnerability-summary.md
              echo "|----------|----|---------|---------|-------------|" >> vulnerability-summary.md
              jq -r '.Results[] | select(.Vulnerabilities != null) | .Vulnerabilities[] | 
                "| \(.Severity) | \(.VulnerabilityID) | \(.PkgName) | \(.InstalledVersion) | \(.Title) |"' trivy-code-results.json >> vulnerability-summary.md
            fi
          fi

          if [ -s trivy-docker-results.json ]; then
            COUNT=$(jq '[.Results[] | select(.Vulnerabilities != null) | .Vulnerabilities[]] | length' trivy-docker-results.json)
            if [ "$COUNT" -gt 0 ]; then
              HAS_VULNS=true
              echo "### Docker Image Vulnerabilities Detected: $COUNT" >> vulnerability-summary.md
              echo "| Severity | ID | Package | Version | Description |" >> vulnerability-summary.md
              echo "|----------|----|---------|---------|-------------|" >> vulnerability-summary.md
              jq -r '.Results[] | select(.Vulnerabilities != null) | .Vulnerabilities[] |
                "| \(.Severity) | \(.VulnerabilityID) | \(.PkgName) | \(.InstalledVersion) | \(.Title) |"' trivy-docker-results.json >> vulnerability-summary.md
            fi
          fi

          echo "has_vulnerabilities=$HAS_VULNS" >> $GITHUB_OUTPUT
          cat vulnerability-summary.md

      - name: Upload Summary Markdown
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vulnerability-summary-${{ env.COMMIT_ID }}
          path: vulnerability-summary.md

      - name: Extract Code Owners
        id: codeowners
        if: always()
        run: |
          if [ -f "CODEOWNERS" ]; then
            OWNERS=$(grep -v "^#" CODEOWNERS | grep -o '@[^ ]*' | sort -u | tr '\n' ',' | sed 's/,$//')
            echo "owners=$OWNERS" >> $GITHUB_OUTPUT
          else
            echo "owners=" >> $GITHUB_OUTPUT
          fi

      - name: Send Email Notification
        if: always() && (steps.summary.outputs.has_vulnerabilities == 'true' || failure())
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: >
            ${{ 
              (failure() && '🚨 Scan Failed: ') || 
              (steps.summary.outputs.has_vulnerabilities == 'true' && '⚠️ Vulnerabilities Found: ') ||
              '✅ Scan Completed: '
            }}Security Scan for ${{ github.repository }}
          body: |
            <p>View <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">workflow run</a> | <a href="${{ github.server_url }}/${{ github.repository }}/commit/${{ env.COMMIT_ID }}">commit</a></p>
            ${{ fileContents('vulnerability-summary.md') }}
            <p>Download full reports from workflow artifacts.</p>
          to: ${{ steps.codeowners.outputs.owners || secrets.SECURITY_EMAIL_RECIPIENTS }}
          from: GitHub Actions <noreply@github.com>
          content_type: text/html

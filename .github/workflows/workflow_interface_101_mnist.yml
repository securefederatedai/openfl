#---------------------------------------------------------------------------
# Workflow to run 101 MNIST Notebook
#---------------------------------------------------------------------------
name: Workflow MNIST Local Runtime E2E

on:
  workflow_call:
    inputs:
      commit_id:
        required: false
        type: string
  workflow_dispatch:
    inputs:
      commit_id:
        required: false
        type: string
        description: 'Commit ID to run the workflow against. If not provided, the latest commit will be used.'

permissions:
  contents: read

jobs:
  wf_local_101_mnist:
    name: WF Local Without TLS
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
    - name: Set commit ID to latest if not provided
      id: set_commit_id
      run: echo "::set-output name=commit_id::${{ github.sha }}"
      if: ${{ inputs.commit_id == '' }}

    - name: Checkout OpenFL repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 2 # needed for detecting changes
        submodules: "true"
        token: ${{ secrets.GITHUB_TOKEN }}
        ref: ${{ inputs.commit_id || steps.set_commit_id.outputs.commit_id }}  # use commit_id from the calling workflow

    - name: Print the commit ID
      run: echo "The commit ID is ${{ inputs.commit_id || steps.set_commit_id.outputs.commit_id }}"

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"


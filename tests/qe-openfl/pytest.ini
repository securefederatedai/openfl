[pytest]
; addopts = -ra -q -s --junitxml=results/results.xml --html=results/report.html
testpaths = test_suites
junit_family = xunit2
results_dir = results
log_level = DEBUG
markers =
    smoke: mark a test as a smoke test.
    system_test: mark a test as a system test.
    functional_test: mark a test as a functional test.
    regression: mark a test as a regression test.
    alpha1: mark a test as a new feature test.
    network_and_interrupt: mark a test as a network and interrupt test.
    experiment_management: mark a test as an experiment management test.
    input_validation: mark a test as a UI input validation test.
    byom: mark a test as a BYOM test.
    generative_model: mark a test as a generative model test.
    test_id(id): mark a test with a specific test ID.

